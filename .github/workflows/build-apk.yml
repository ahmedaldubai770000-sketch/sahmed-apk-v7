name: Build Sahmed APK V7 Final
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          ls -la
          
      - name: Add Android platform
        run: |
          npx cap add android || true
          ls android/app/src/main/java/com/ -R
          
      - name: Override MainActivity V7 with ScreenShare Bridge
        run: |
          echo "Copying V7 MainActivity with native bridge..."
          cp android-template/MainActivity.java android/app/src/main/java/com/sahmed/privatechat/MainActivity.java || cp android-template/MainActivity.java android/app/src/main/java/com/getcapacitor/myapp/MainActivity.java || find android -name MainActivity.java -exec cp android-template/MainActivity.java {} \;
          cp android-template/ScreenCaptureService.java android/app/src/main/java/com/sahmed/privatechat/ || true
          cat android/app/src/main/java/com/sahmed/privatechat/MainActivity.java || cat android/app/src/main/java/com/getcapacitor/myapp/MainActivity.java
          echo "Bridge check:"
          grep -n "startScreenCapture" android/app/src/main/java/com/sahmed/privatechat/MainActivity.java || grep -rn "startScreenCapture" android/
          
      - name: Copy web assets to android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/ || true
          npx cap copy android || true
          npx cap sync android || true
          
      - name: Build APK V7 Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          
      - name: Upload APK V7 Final
        uses: actions/upload-artifact@v4
        with:
          name: Sahmed-Final-V7-Pure-Chinese-Fixed
          path: android/app/build/outputs/apk/debug/app-debug.apk
